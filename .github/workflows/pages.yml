# Publishes the web app (the src folder) to GitHub Pages whenever it changes on main.
name: Publish web app

on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/build-web.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the offline cache list
        run: node tools/build-web.js
      - name: Check content and libraries
        run: |
          node tools/validate.js > /dev/null
          node tools/test-lib.js
          node tools/test-sync.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
